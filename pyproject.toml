[project]
name = "gridworks-terminalasset"
version = "0.0.1"
description = "GridWorks terminal asset GNode actor — simulated terminal assets first"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "fmpy>=0.3.22",
    "gridworks-base>=0.7.3",
]

[project.scripts]
ta-hello = "gwta.hello:main"
ta-plant = "gwta.plant:main"
ta-katahdin-layout = "gwta.katahdin_layout:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
markers = [
    "live: needs a reachable rabbit broker (run with `pytest -m live`)",
    "fmu: needs build/KatahdinPlant.fmu from scripts/build_fmu.sh (run with `pytest -m fmu`)",
]
addopts = "-m 'not live and not fmu'"

[tool.pyright]
include = ["src", "tests"]
# Generated by scripts/regen_sema_snapshot.sh: checking it means editing it,
# and edits vanish at regen. Its typing is the sema generator's job.
exclude = ["src/gwta/sema"]

[tool.hatch.build.targets.wheel]
packages = ["src/gwta"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
